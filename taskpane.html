<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AssistDMS - Taskpane</title>
    
    <!-- Office.js -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <!-- API Configuration -->
    <script src="config.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            color: #333;
        }
        
        h2 {
            margin-top: 0;
            color: #0078d4;
        }
        
        .section {
            margin-bottom: 25px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 4px;
        }
        
        .email-info {
            padding: 10px;
            background: #fff;
            border-left: 3px solid #0078d4;
            margin-bottom: 15px;
        }
        
        .email-info strong {
            display: block;
            margin-bottom: 5px;
            color: #0078d4;
        }
        
        button {
            background: #0078d4;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px 5px 5px 0;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
        }
        
        button:hover {
            background: #106ebe;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        select, input[type="text"], textarea {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        label {
            display: block;
            margin-top: 10px;
            font-weight: 600;
        }
        
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .ticket-list {
            max-height: 200px;
            overflow-y: auto;
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .ticket-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        
        .ticket-item:hover {
            background: #f0f0f0;
        }
        
        .ticket-item:last-child {
            border-bottom: none;
        }
        
        .ticket-number {
            font-weight: bold;
            color: #0078d4;
        }
        
        .hidden {
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>

<body>
    <h2>📧 AssistDMS</h2>
    
    <div id="status" class="status"></div>
    
    <!-- Email Info Section -->
    <div class="section">
        <div class="email-info">
            <strong>Huidige Email:</strong>
            <div id="emailSubject">Laden...</div>
        </div>
        <div class="email-info">
            <strong>Van:</strong>
            <div id="emailFrom">Laden...</div>
        </div>
    </div>
    
    <!-- Actions Section -->
    <div class="section">
        <h3>Acties</h3>
        
        <button onclick="showNewTicketForm()">🎫 Nieuw Ticket Maken</button>
        <button onclick="showLinkToTicketForm()">🔗 Koppel aan Bestaand Ticket</button>
        <button onclick="showArchiveForm()">📦 Archiveer Email</button>
        <button onclick="showTimeEntryForm()">⏱️ Schrijf Uren</button>
    </div>
    
    <!-- New Ticket Form -->
    <div id="newTicketForm" class="section hidden">
        <h3>Nieuw Ticket</h3>
        <label for="customerSelect">Klant:</label>
        <select id="customerSelect">
            <option value="">Laden...</option>
        </select>
        
        <label for="ticketTitle">Titel:</label>
        <input type="text" id="ticketTitle" placeholder="Bijv: Email server problemen">
        
        <label for="archiveMailbox">Archive Mailbox (optioneel):</label>
        <input type="text" id="archiveMailbox" placeholder="Laat leeg voor standaard">
        
        <button onclick="createNewTicket()">✅ Ticket Aanmaken</button>
        <button onclick="hideAllForms()">❌ Annuleren</button>
    </div>
    
    <!-- Link to Ticket Form -->
    <div id="linkTicketForm" class="section hidden">
        <h3>Koppel aan Ticket</h3>
        <label>Selecteer Ticket:</label>
        <div id="ticketList" class="ticket-list">
            <div class="loading">Tickets laden...</div>
        </div>
        
        <button onclick="hideAllForms()">❌ Annuleren</button>
    </div>
    
    <!-- Archive Form -->
    <div id="archiveForm" class="section hidden">
        <h3>Email Archiveren</h3>
        <p>Selecteer eerst een ticket om deze email aan te koppelen.</p>
        <label>Ticket:</label>
        <select id="archiveTicketSelect">
            <option value="">Laden...</option>
        </select>
        
        <label for="archiveMailboxOverride">Archive Mailbox (optioneel):</label>
        <input type="text" id="archiveMailboxOverride" placeholder="Laat leeg voor standaard">
        
        <button onclick="archiveEmail()">✅ Archiveer</button>
        <button onclick="hideAllForms()">❌ Annuleren</button>
    </div>
    
    <!-- Time Entry Form -->
    <div id="timeEntryForm" class="section hidden">
        <h3>Uren Schrijven</h3>
        <label>Ticket:</label>
        <select id="timeTicketSelect">
            <option value="">Laden...</option>
        </select>
        
        <label for="timeDescription">Beschrijving:</label>
        <textarea id="timeDescription" rows="3" placeholder="Wat heb je gedaan?"></textarea>
        
        <label for="timeHours">Aantal uren:</label>
        <input type="text" id="timeHours" placeholder="Bijv: 1.5">
        
        <button onclick="addTimeEntry()">✅ Uren Schrijven</button>
        <button onclick="hideAllForms()">❌ Annuleren</button>
    </div>
    
    <script src="taskpane.js"></script>
</body>
</html>
